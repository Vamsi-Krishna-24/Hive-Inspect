<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Import Template – HiveInspect</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen font-sans antialiased">

  <div class="max-w-2xl mx-auto px-6 py-12">

    <!-- Back link -->
    <a href="/" class="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-slate-800 mb-6">
      ← Back to Templates
    </a>

    <h1 class="text-2xl font-bold text-slate-900 mb-1">Import Template</h1>
    <p class="text-slate-500 text-sm mb-8">
      Upload a Spectora export (Templates → Export to spreadsheet → Export HTML Text).
    </p>

    {% if messages %}
      <div class="mb-6 space-y-2">
        {% for message in messages %}
          <div class="rounded-lg px-4 py-3 text-sm font-medium
                      {% if message.tags == 'error' %} bg-red-50 text-red-700 border border-red-200
                      {% else %} bg-green-50 text-green-700 border border-green-200 {% endif %}">
            {{ message }}
          </div>
        {% endfor %}
      </div>
    {% endif %}

    <form method="post" enctype="multipart/form-data" id="import-form">
      {% csrf_token %}

      <div class="bg-white rounded-xl border border-slate-200 p-6 space-y-6 shadow-sm">

        <!-- File -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">Export file (.xls / .xlsx)</label>
          <div class="flex items-center gap-3">
            <label class="cursor-pointer inline-flex items-center px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium rounded-lg transition">
              Choose file
              <input type="file" name="export_file" accept=".xls,.xlsx" required class="hidden" id="file-input"
                     onchange="document.getElementById('file-name').textContent = this.files[0]?.name || 'No file chosen'">
            </label>
            <span id="file-name" class="text-sm text-slate-500">No file chosen</span>
          </div>
        </div>

        <!-- Name -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-2">Template name</label>
          <input type="text" name="template_name" required
                 class="w-full px-3.5 py-2.5 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                 placeholder="e.g. InterNACHI Residential">
        </div>

        <!-- Button -->
        <button type="submit" id="import-btn"
                class="inline-flex items-center justify-center gap-2 px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium rounded-lg transition min-w-[140px]">
          <span id="btn-text">Import</span>
          <svg id="btn-spinner" class="hidden animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
        </button>
      </div>
    </form>
  </div>

  <!-- Full page loading overlay -->
  <div id="loading-overlay" class="fixed inset-0 bg-white/80 backdrop-blur-sm z-50 hidden flex items-center justify-center">
    <div class="text-center">
      <div class="relative w-14 h-14 mx-auto mb-5">
        <div class="absolute inset-0 border-4 border-blue-100 rounded-full"></div>
        <div class="absolute inset-0 border-4 border-blue-600 rounded-full border-t-transparent animate-spin"></div>
      </div>
      <p class="text-slate-700 font-medium text-lg">Importing template…</p>
      <p class="text-sm text-slate-400 mt-1">This may take a few seconds</p>
    </div>
  </div>

  <script>
    document.getElementById('import-form').addEventListener('submit', function () {
      const btn = document.getElementById('import-btn');
      const btnText = document.getElementById('btn-text');
      const spinner = document.getElementById('btn-spinner');
      const overlay = document.getElementById('loading-overlay');

      btn.disabled = true;
      btn.classList.add('opacity-70', 'cursor-not-allowed');
      btnText.textContent = 'Importing…';
      spinner.classList.remove('hidden');
      overlay.classList.remove('hidden');
    });
  </script>
</body>
</html>
